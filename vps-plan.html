<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS Plan Configuration | Vertex Core</title>
<meta name="description" content="Configure your Vertex Core Windows VPS plan.">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', 'Segoe UI', Arial, sans-serif;
}

html{scroll-behavior:smooth}

body{
  background:#060a14;
  color:#fff;
  overflow-x:hidden;
}

a{color:inherit; text-decoration:none;}

/* =========================
   HEADER & NAVBAR STYLES
========================= */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 5%;
  background:rgba(10,15,30,.94);
  border-bottom:1px solid #1a233a;
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(12px);
}

.logo{
  display:flex;
  align-items:center;
  text-decoration:none;
}

.logo img{
  width:185px;
  height:auto;
  display:block;
  object-fit:contain;
}

nav{
  display:flex;
  align-items:center;
}

nav a{
  color:#8b9bb4;
  text-decoration:none;
  margin:0 12px;
  font-size:14px;
  transition:.2s;
}

nav a:hover{color:#fff}

.header-actions{
  display:flex;
  align-items:center;
}

.btn-blue{
  background:#1e90ff;
  color:#fff;
  padding:11px 20px;
  border-radius:8px;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 0 20px rgba(30,144,255,.35);
  border:none;
  display:inline-block;
  transition:.25s;
  cursor:pointer;
}

.btn-blue:hover{
  filter:brightness(1.1);
  transform:translateY(-2px);
}

.btn-outline{
  border:1px solid #263753;
  padding:11px 20px;
  border-radius:8px;
  text-decoration:none;
  color:#8b9bb4;
  margin-left:10px;
  display:inline-block;
  transition:.25s;
}

.btn-outline:hover{
  border-color:#1e90ff;
  color:#fff;
}

.menu-btn{
  display:none;
  background:transparent;
  border:1px solid #1e90ff;
  color:#1e90ff;
  width:44px;
  height:44px;
  border-radius:10px;
  font-size:25px;
  cursor:pointer;
}

/* =========================
   SIDEBAR STYLES
========================= */
.sidebar{
  position:fixed;
  top:0;
  left:-330px;
  width:310px;
  height:100vh;
  background:#080d18;
  border-right:1px solid #1e90ff;
  z-index:100;
  padding:25px;
  transition:.3s;
  box-shadow:10px 0 40px rgba(0,0,0,.5);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.sidebar.open{
  left:0;
}

.side-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:30px;
}

.side-close{
  background:transparent;
  border:none;
  color:#8b9bb4;
  font-size:28px;
  cursor:pointer;
  transition:.2s;
}

.side-close:hover{ color:#fff; }

.side-links{
  display:flex;
  flex-direction:column;
  gap:15px;
  margin-bottom:auto;
}

.side-links a{
  color:#8b9bb4;
  font-size:15px;
  font-weight:600;
  transition:.2s;
}

.side-links a:hover{ color:#1e90ff; }

.side-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.side-actions .btn-outline{
  margin-left:0;
  text-align:center;
}

.side-actions .btn-blue{
  text-align:center;
}

/* Overlay for Mobile Sidebar */
.sidebar-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(4px);
  z-index:99;
  display:none;
}

.sidebar-overlay.active{
  display:block;
}

/* =========================
   HERO & MAIN CONFIG STYLES
========================= */
.hero{
  min-height:280px;
  padding:60px 5% 45px;
  text-align:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%,rgba(30,144,255,.16),transparent 45%),
    linear-gradient(180deg,#0a1020,#060a14);
  border-bottom:1px solid #121d32;
}

.hero::before{
  content:"";
  position:absolute;
  width:560px;
  height:560px;
  left:50%;
  top:-380px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(30,144,255,.15),transparent 68%);
  animation:pulseGlow 4s ease-in-out infinite;
}

@keyframes pulseGlow{
  0%,100%{transform:translateX(-50%) scale(.9);opacity:.55}
  50%{transform:translateX(-50%) scale(1.12);opacity:1}
}

.hero > *{
  position:relative;
  z-index:2;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#5eb1ff;
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:15px;
}
