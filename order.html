<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Checkout | Vertex Core</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
body{ background:#060a14; color:#fff; padding:40px 5%; }
.checkout-wrapper{ max-width:1000px; margin:auto; display:grid; grid-template-columns:1fr 380px; gap:30px; }
.form-card, .summary-box{ background:linear-gradient(180deg,#121a2e,#0a1020); border:1px solid #1e293b; border-radius:18px; padding:30px; }
h2{ font-size:22px; margin-bottom:20px; color:#1e90ff; }
.form-group{ margin-bottom:15px; }
label{ display:block; font-size:13px; color:#8b9bb4; margin-bottom:6px; }
input, select{ width:100%; padding:12px; background:#0a1220; border:1px solid #1e293b; border-radius:8px; color:#fff; outline:none; }
input:focus{ border-color:#1e90ff; }
.checkout-btn{ width:100%; background:#1e90ff; color:#fff; border:none; padding:15px; border-radius:10px; font-weight:700; cursor:pointer; box-shadow:0 0 20px rgba(30,144,255,0.4); margin-top:15px; }
.checkout-btn:hover{ filter:brightness(1.15); }
.summary-box{ background:linear-gradient(180deg,#1b1035,#0d071a); border-color:#2d1854; }
.item-row{ display:flex; justify-content:space-between; margin-bottom:12px; font-size:14px; color:#aab8cb; }
.item-row strong{ color:#fff; }
.total-highlight{ font-size:36px; font-weight:900; color:#fff; margin:15px 0 5px; }
</style>
</head>
<body>

<div class="checkout-wrapper">
  <!-- Form Details -->
  <div class="form-card">
    <h2>Customer Information</h2>
    <form onsubmit="alert('Order successfully submitted!'); return false;">
      <div class="form-group"><label>First Name</label><input type="text" required></div>
      <div class="form-group"><label>Last Name</label><input type="text" required></div>
      <div class="form-group"><label>Email Address</label><input type="email" required></div>
      <div class="form-group"><label>Phone Number</label><input type="tel" required></div>
      <h2>Payment Method</h2>
      <div class="form-group">
        <select>
          <option>Credit / Debit Card</option>
          <option>PayPal</option>
          <option>Crypto Payment</option>
        </select>
      </div>
      <button type="submit" class="checkout-btn">Complete Order ➜</button>
    </form>
  </div>

  <!-- Order Details Sidebar -->
  <div class="summary-box">
    <h2 style="color:#fff;">Order Summary</h2>
    <div class="item-row"><span>Product:</span><strong id="outPlan">-</strong></div>
    <div class="item-row"><span>Location:</span><strong id="outLocation">-</strong></div>
    <div class="item-row"><span>Cycle:</span><strong id="outCycle">-</strong></div>
    <hr style="border-color:rgba(255,255,255,0.1); margin:15px 0;">
    <div style="font-size:12px; color:#aab8cb;">Total Amount Due:</div>
    <div class="total-highlight">$<span id="outTotal">0.00</span></div>
    <div style="color:#1e90ff; font-weight:800;">USD</div>
  </div>
</div>

<script>
const pricingDatabase = {
  "Italy": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Greece": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Norway": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Canada": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "London": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Spain": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Manchester UK": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Germany": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Sweden": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "France": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Austria": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Belgium": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Hungary": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Netherlands": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Ireland": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "Australia": { "2gb": [15, 45, 90, 150], "4gb": [24, 72, 144, 240], "8gb": [38, 114, 228, 380] },
  "KSA": { "2gb": [20, 60, 120, 240], "4gb": [35, 105, 210, 420], "8gb": [50, 150, 300, 600] },
  "South Korea": { "2gb": [20, 60, 120, 240], "4gb": [35, 105, 210, 420], "8gb": [50, 150, 300, 600] },
  "Bangladesh": { "2gb": [20, 60, 120, 240], "4gb": [35, 105, 210, 420], "8gb": [50, 150, 300, 600] },
  "Bahrain": { "2gb": [20, 60, 120, 240], "4gb": [35, 105, 210, 420], "8gb": [50, 150, 300, 600] },
  "Qatar": { "2gb": [20, 60, 120, 240], "4gb": [35, 105, 210, 420], "8gb": [50, 150, 300, 600] },
  "UAE": { "2gb": [20, 60, 120, 240], "4gb": [35, 105, 210, 420], "8gb": [50, 150, 300, 600] }
};

const urlParams = new URLSearchParams(window.location.search);
const plan = urlParams.get('plan') || '2gb';
const cycle = urlParams.get('cycle') || 'monthly';
const locationVal = urlParams.get('location') || 'Italy';

const planPrices = pricingDatabase[locationVal][plan] || pricingDatabase["Italy"]["2gb"];
let total = planPrices[0];
if(cycle === 'quarterly') total = planPrices[1];
if(cycle === 'semi-annually') total = planPrices[2];
if(cycle === 'annually') total = planPrices[3];

document.getElementById('outPlan').textContent = `VPS ${plan.toUpperCase()}`;
document.getElementById('outLocation').textContent = locationVal;
document.getElementById('outCycle').textContent = cycle.toUpperCase();
document.getElementById('outTotal').textContent = total.toFixed(2);
</script>
</body>
</html>
