```html
<!-- VPS PLAN -->
<div class="form-group-block full">
  <label class="form-label">Select VPS Plan</label>
  <input
    class="form-control"
    list="vpsPlans"
    name="vps_plan"
    placeholder="Select or type your VPS plan"
    required
  >

  <datalist id="vpsPlans">
    <option value="2GB VPS - $10.00/mo">
    <option value="4GB VPS - $18.00/mo">
    <option value="8GB VPS - $32.00/mo">
  </datalist>
</div>

<!-- SERVER LOCATION -->
<div class="form-group-block">
  <label class="form-label">Server Location</label>
  <input
    class="form-control"
    list="serverLocations"
    name="server_location"
    placeholder="Select or type server location"
    required
  >

  <datalist id="serverLocations">
    <option value="United States">
    <option value="United Kingdom">
    <option value="Germany">
    <option value="Netherlands">
    <option value="Canada">
    <option value="France">
    <option value="Singapore">
    <option value="Australia">
  </datalist>
</div>
```
